        type: string
      dataset:
        description: BigQuery configuration
        type: string
      dd_datatype:
        type: string
      dd_host:
        type: string
      dd_hostname:
        type: string
      dd_level:
        type: string
      dd_message:
        type: string
      dd_service:
        type: string
      dd_source:
