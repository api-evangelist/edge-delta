    type: string
    enum:
    - Edge
    - Cloud
    - IngestionPipeline
    - Edge-extended
    - Cloud-extended
    x-enum-varnames:
    - EdgeFleetType
    - CloudFleetType
    - IngestionPipelineFleetType
    - EdgeExtendedFleetType
    - CloudExtendedFleetType
  core.WizardTemplateResponse:
    type: object
    properties:
      config_details:
        $ref: '#/definitions/core.Conf'
      config_template:
        $ref: '#/definitions/core.Template'
      values:
        type: object
        additionalProperties: true
  core.ConfigVersion:
    type: string
    enum:
    - v2
    - v3
    x-enum-varnames:
    - ConfigV2
    - ConfigV3
  core.HTTPWorkflowTestResult:
    type: object
    properties:
      steps:
        type: array
        items:
