    type: object
    properties:
      integrations:
        type: array
        items:
          $ref: '#/definitions/nodetype.NodeType'
  core.Template:
    type: object
    properties:
      configVersion:
        description: The version of the underlying config YAML
        allOf:
        - $ref: '#/definitions/core.ConfigVersion'
      deploy:
        type: string
      description:
        type: string
      id:
        type: string
      labels:
        type: string
      name:
        type: string
      raw_value:
        type: array
        items:
          type: integer
      type:
        type: string
      updated:
        type: string
      value:
        type: string
      version:
        type: string
