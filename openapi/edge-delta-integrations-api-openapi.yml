swagger: '2.0'
info:
  description: 'Edge Delta API provides endpoints to manage your configs/integrations/rehydrations and more. Generate an API token to get started: https://app.edgedelta.com/admin/organization#api-tokens'
  title: Edge Delta Access Integrations API
  contact:
    name: API Support
    email: support@edgedelta.com
  version: '1.0'
host: api.edgedelta.com
basePath: ''
schemes:
- https
tags:
- name: Integrations
paths:
  /v1/orgs/{org_id}/http_workflow_input/test:
    post:
      security:
      - ApiKeyAuth: []
      description: Tests an HTTP Workflow input by executing its configured steps
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Integrations
      parameters:
      - type: string
        description: Org ID
        name: org_id
        in: path
        required: true
      - description: YAML config of the HTTP Workflow input to test
        name: request
        in: body
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/core.IntegrationTestResponse'
  /v1/orgs/{org_id}/integrations:
    get:
      security:
      - ApiKeyAuth: []
      description: Returns template for streaming/trigger integrations.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Integrations
      parameters:
      - type: string
        description: Org ID
        name: org_id
        in: path
        required: true
      - type: string
        description: Integrations template ID
        name: template_id
        in: query
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/core.WizardTemplateResponse'
    post:
      security:
      - ApiKeyAuth: []
      description: Saves the new integration endpoints in org-settings.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Integrations
      parameters:
      - type: string
        description: Org ID
        name: org_id
        in: path
        required: true
      - type: string
        description: Integrations Template ID
        name: template_id
        in: query
        required: true
      - description: Dictionary of changed integrations {id:value}
        name: values
        in: body
        required: true
        schema:
          type: object
      responses:
        '200':
          description: OK
    delete:
      security:
      - ApiKeyAuth: []
      description: Delete given integration endpoints in org-settings.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Integrations
      parameters:
      - type: string
        description: Org ID
        name: org_id
        in: path
        required: true
      - type: string
        description: Comma separated names of integration endpoints to delete
        name: names
        in: query
        required: true
      responses:
        '200':
          description: OK
  /v1/orgs/{org_id}/integrations_v2:
    get:
      security:
      - ApiKeyAuth: []
      description: Returns template for streaming/trigger integrations.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Integrations
      parameters:
      - type: string
        description: Org ID
        name: org_id
        in: path
        required: true
      - type: string
        description: Integrations template ID
        name: template_id
        in: query
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/core.WizardTemplateResponse'
  /v1/orgs/{org_id}/integrations_v2/test:
    post:
      security:
      - ApiKeyAuth: []
      description: Tests the connectivity of the given integration endpoints.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Integrations
      parameters:
      - type: string
        description: Org ID
        name: org_id
        in: path
        required: true
      - description: YAML config of the integration to test
        name: request
        in: body
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/core.IntegrationTestResponse'
  /v1/orgs/{org_id}/integrations_v2/test/supported:
    get:
      security:
      - ApiKeyAuth: []
      description: Lists of integrations that support testing connectivity.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Integrations
      parameters:
      - type: string
        description: Org ID
        name: org_id
        in: path
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/admin.SupportedIntegrationsForTestingResponse'
