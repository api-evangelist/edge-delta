  core.HTTPWorkflowStepResult:
    type: object
    properties:
      body:
        type: string
      error:
        type: string
      headers:
        type: object
        additionalProperties:
          type: string
      index:
        type: integer
      latency_ms:
        type: integer
      name:
        type: string
      status_code:
        type: integer
      variables:
        type: object
        additionalProperties: {}
