    type: string
    enum:
    - user-defined
    - edgedelta-ai
    x-enum-varnames:
    - ConfPurposeUserDefined
    - ConfPurposeEdgedeltaAI
  core.FleetStatus:
    type: string
    enum:
    - running
    - suspended
    x-enum-varnames:
    - FleetRunning
    - FleetSuspended
  core.ConfMetadata:
    type: object
    properties:
